services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./cust-admin-BE
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8090
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CAPTCHA_KEY: ${CAPTCHA_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      COMPANY_NAME: ${COMPANY_NAME}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS}
      COMPANY_PHONE: ${COMPANY_PHONE}
      COMPANY_EMAIL: ${COMPANY_EMAIL}
      COMPANY_UEN: ${COMPANY_UEN}
      GST_ENABLED: ${GST_ENABLED}
      GST_RATE: ${GST_RATE}
      STOREFRONT_URL: https://${DOMAIN}
    # Not published to the host — reachable only from other containers, at
    # backend:8090, via nginx's /api/ proxy below. Nothing external needs
    # to reach it directly anymore.
    volumes:
      - backend_images:/app/public/images
      - backend_videos:/app/public/videos

  admin-fe:
    build:
      context: ./admin-FE
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_BASE_PATH: /admin
    restart: unless-stopped
    depends_on:
      - backend
    # Not published to the host — reachable only via nginx's /admin/ proxy
    # below, at admin-fe:3000.

  cust-fe:
    build:
      context: ./cust-FE
      args:
        VITE_API_URL: https://${DOMAIN}
        VITE_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  # Reverse proxy in front of all three apps — storefront at /, admin
  # dashboard at /admin, backend API at /api, all on one HTTPS domain.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - cust-fe
      - admin-fe
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # Not a long-running service — invoked on demand via
  # `docker compose run --rm certbot ...` by init-letsencrypt.sh (first
  # issuance) and renew-cert.sh (renewal cron). See DEPLOY.md.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  pgdata:
  backend_images:
  backend_videos:
  certbot_etc:
  certbot_www:
